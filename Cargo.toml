[package]
name = "oft-node-rx5808"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "OFT Node firmware for RotorHazard-style STM32 timers (S32_BPill pin map, NuclearHazard): up to 8 RX5808 receivers, one seat each, on the Node link"
publish = false

[[bin]]
name = "oft-node-rx5808"
test = false
bench = false

[dependencies]
oft-nodelink = { path = "../oft/crates/oft-nodelink" }

embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread"] }
embassy-stm32 = { version = "0.6.0", features = ["stm32f103c8", "time-driver-any", "memory-x", "unstable-pac"] }
embassy-time = { version = "0.5.1", features = ["tick-hz-1_000_000"] }
embassy-sync = "0.8.0"
embedded-io-async = "0.7.0"
static_cell = "2.1"
cortex-m = { version = "0.7.6", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.0"
panic-halt = "1.0"

[profile.release]
debug = 2
lto = "fat"
opt-level = "s"
codegen-units = 1
